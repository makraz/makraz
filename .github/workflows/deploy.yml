name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets cannot be referenced directly in a step-level `if`, so surface presence as a plain
    # boolean here. This exposes only whether the token exists, never its value.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # PUBLIC_TURNSTILE_SITE_KEY comes from the committed .env.production, which Astro
      # loads for production builds. ALLOW_MISSING_TURNSTILE is deliberately NOT set here:
      # a missing site key must fail this build rather than ship a dead contact widget.
      - name: Build
        run: pnpm build

      # Reads wrangler.jsonc from the repo root, which the build has resolved into
      # dist/server/wrangler.json (the real main/assets paths).
      #
      # Gated on the token existing. Without the gate, wrangler fails with an unhelpful
      # "exit code 1" on every single push, which trains everyone to ignore red builds. A skip
      # with a warning is honest signal: tests and build still ran and still gate the branch.
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Explain a skipped deploy
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so nothing was published. Create a token (Cloudflare → My Profile → API Tokens → 'Edit Cloudflare Workers'), run 'gh secret set CLOUDFLARE_API_TOKEN', then re-run this workflow. Until then, deploy manually with 'pnpm deploy'."
