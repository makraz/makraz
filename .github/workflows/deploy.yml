name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # PUBLIC_TURNSTILE_SITE_KEY comes from the committed .env.production, which Astro
      # loads for production builds. ALLOW_MISSING_TURNSTILE is deliberately NOT set here:
      # a missing site key must fail this build rather than ship a dead contact widget.
      - name: Build
        run: npm run build

      # Reads wrangler.jsonc from the repo root, which the build has resolved into
      # dist/server/wrangler.json (the real main/assets paths).
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
